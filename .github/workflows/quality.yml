name: Quality Checks

on:
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Compile Python source
        run: python -m compileall -q bot.py

      - name: Run Ruff
        run: ruff check .

      - name: Verify dependency consistency
        run: python -m pip check

  documentation:
    name: Markdown and optional TypeScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Type-check TypeScript when present
        shell: bash
        run: |
          if find . -type f \( -name '*.ts' -o -name '*.tsx' \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print -quit | grep -q .; then
            if [ ! -f tsconfig.json ]; then
              echo "::error::TypeScript source files exist, but tsconfig.json is missing."
              exit 1
            fi
            npx --yes --package typescript tsc --noEmit --project tsconfig.json
          else
            echo "No TypeScript source files found; TypeScript check skipped."
          fi
